[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proctorai-ai-engine"
version = "0.1.0"
description = "Local-only AI sidecar for ProctorAI candidate monitoring"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=2.0.0",
  "opencv-python>=4.10.0",
  "pillow>=10.0.0",
  "pydantic>=2.8.0",
  "ultralytics>=8.3.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
