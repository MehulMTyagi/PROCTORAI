[package]
name = "proctorai-candidate"
version = "0.1.0"
description = "ProctorAI candidate desktop shell"
authors = ["ProctorAI Team"]
edition = "2021"

[lib]
name = "proctorai_candidate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
